name: "CanIScan"
description: "Scan AI agent and MCP configurations for leaked secrets, unpinned servers, risky permissions and hidden prompt injections"
author: "NghiaNguyenPhuocHuu"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Path to scan"
    default: "."
  fail-on:
    description: "Fail the step at or above this severity: low, medium, high, critical, never"
    default: "high"
  sarif-file:
    description: "Where to write the SARIF report"
    default: "caniscan.sarif"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install caniscan
      shell: bash
      run: python -m pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}
    # Inputs are passed through env vars, never interpolated into the script,
    # to avoid GitHub Actions script injection.
    - name: Run caniscan
      shell: bash
      run: caniscan "$SCAN_PATH" --no-global --format sarif --output "$SARIF_FILE" --fail-on "$FAIL_ON"
      env:
        SCAN_PATH: ${{ inputs.path }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        FAIL_ON: ${{ inputs.fail-on }}
