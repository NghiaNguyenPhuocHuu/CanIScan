name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
        # ubuntu-latest (26.04) has no setup-python build for 3.9 (EOL Oct 2025); test it on 24.04
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  self-scan:
    # Dogfood: the demo must keep triggering every rule family.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python examples/make_demo.py /tmp/demo
      - run: caniscan /tmp/demo --fail-on never
      - run: caniscan . --no-global   # the repo itself must stay clean

  ci-ok:
    # The single required status check for the main-branch ruleset. Matrix job names change when
    # the matrix does, so the ruleset requires this one stable name instead.
    # `if: always()` matters: when a needed job fails, a plain dependent job is *skipped*, and
    # GitHub treats a skipped required check as passing. Check the results explicitly.
    if: always()
    needs: [test, self-scan]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required CI job did not succeed ($r)"; exit 1; }
          done
